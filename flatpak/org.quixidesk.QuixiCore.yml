app-id: org.quixidesk.QuixiCore
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: quixicore-flatpak
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.KWin
  - --talk-name=org.kde.KWin.Scripting
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/quixicore/cargo
    # One source tree, every edition: the label is a compile-time variable, so the Core build says
    # which build it is in its own title bar.
    QUIXI_EDITION_LABEL: "(QUIXI CORE LINUX) "
modules:
  - name: quixicore
    buildsystem: simple
    build-commands:
      - cargo build --release --offline -p quixi-app
      - install -Dm755 target/release/QuixiDesk /app/bin/QuixiDesk
      - install -Dm755 flatpak/quixicore-flatpak /app/bin/quixicore-flatpak
      - install -Dm644 flatpak/org.quixidesk.QuixiCore.desktop /app/share/applications/org.quixidesk.QuixiCore.desktop
      - install -Dm644 flatpak/org.quixidesk.QuixiCore.metainfo.xml /app/share/metainfo/org.quixidesk.QuixiCore.metainfo.xml
      - mkdir -p /app/share/quixicore && cp -a resources /app/share/quixicore/resources
    sources:
      - type: dir
        path: ..
